name: CampusFind UI evidence
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ui-evidence.yml'
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install app
        run: npm ci
      - name: Install headless browser
        run: npx --yes playwright@1.56.0 install chromium --with-deps
      - name: Start CampusFind
        run: |
          (npm run dev:all > /tmp/campusfind.log 2>&1 &)
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:3001/api/health >/dev/null && curl -fsS http://localhost:5173/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/campusfind.log
          exit 1
      - name: Capture real running application
        run: |
          mkdir -p artifacts
          npx --yes playwright@1.56.0 screenshot --browser chromium --viewport-size="1440,900" --wait-for-timeout=1500 http://localhost:5173/ artifacts/01-home.png
          npx --yes playwright@1.56.0 screenshot --browser chromium --viewport-size="1440,900" --wait-for-timeout=1500 http://localhost:5173/browse artifacts/02-browse.png
          npx --yes playwright@1.56.0 screenshot --browser chromium --viewport-size="1440,900" --wait-for-timeout=1500 http://localhost:5173/login artifacts/03-login.png
          npx --yes playwright@1.56.0 screenshot --browser chromium --viewport-size="1440,900" --wait-for-timeout=1500 http://localhost:5173/register artifacts/04-register.png
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: campusfind-running-ui-screenshots
          path: artifacts/*.png
