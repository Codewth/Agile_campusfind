name: CampusFind verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Backend and matching tests
        run: npm run test:all
      - name: Frontend tests
        run: npm test -- tests/match.test.js
      - name: Production build
        run: npm run build
